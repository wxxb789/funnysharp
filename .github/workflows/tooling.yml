name: tooling

# Lightweight PR merge checks on every supported operating system.
# The required check is the aggregate `tooling-gate`; manually dispatched
# release workflow contexts gate release acceptance, not ordinary PR merges.
#
# No `paths` filter on purpose: the required check must always report a
# result instead of staying pending on changes outside the filter.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Prepare the tooling log directory
        run: mkdir -p "$RUNNER_TEMP/tooling-logs"

      - name: Incremental harness build
        run: |
          dotnet build eng/harness/FunnySharp.Harness.fsproj -p:RestoreLockedMode=true 2>&1 | tee "$RUNNER_TEMP/tooling-logs/build.log"

      - name: Verify the documentation snippets
        run: |
          dotnet fsi build.fsx -- -p verify-docs-snippets 2>&1 \
            | tee "$RUNNER_TEMP/tooling-logs/verify-docs-snippets.log"

      - name: Check the workflow action pins
        run: |
          dotnet fsi build.fsx -- -p check-action-pins 2>&1 \
            | tee "$RUNNER_TEMP/tooling-logs/action-pins.log"

      - name: Upload tooling logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tooling-logs-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tooling-logs
          if-no-files-found: ignore
          retention-days: 7

  # One required aggregate check instead of three required matrix contexts.
  # A macOS job cancelled before any runner picked it up is reported as a warning:
  # that is runner unavailability, not a code failure, and it must not block merges.
  # A macOS job that did run and failed still fails this gate.
  tooling-gate:
    name: tooling-gate
    needs: tooling
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the tooling matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="${{ needs.tooling.result }}"
          if [ "$result" = "success" ]; then
            echo "tooling matrix succeeded."
            exit 0
          fi

          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("tooling (")) | [.name, .conclusion, (.runner_name // ""), (.steps | length)] | join("|")')
          if [ -z "$jobs" ]; then
            echo "::error::could not read any tooling matrix job results."
            exit 1
          fi

          fail=0
          macos_unavailable=0
          while IFS='|' read -r name conclusion runner steps; do
            case "$name" in
              "tooling (ubuntu-latest)"|"tooling (windows-2025)")
                if [ "$conclusion" != "success" ]; then
                  echo "::error::$name concluded '$conclusion'; both required operating systems must pass."
                  fail=1
                fi
                ;;
              "tooling (macos-15)")
                if [ "$conclusion" = "success" ]; then
                  :
                elif [ "$conclusion" = "cancelled" ] && [ -z "$runner" ] && [ "$steps" = "0" ]; then
                  macos_unavailable=1
                  echo "::warning::tooling (macos-15) was cancelled before any runner picked it up; treating this as runner unavailability, not a code failure."
                else
                  echo "::error::tooling (macos-15) concluded '$conclusion'; a dispatched macOS check must pass."
                  fail=1
                fi
                ;;
              *)
                echo "::error::unexpected tooling matrix job '$name'."
                fail=1
                ;;
            esac
          done <<< "$jobs"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          if [ "$macos_unavailable" -eq 1 ]; then
            echo "tooling matrix passed on ubuntu and windows; macOS was skipped because no runner became available."
          else
            echo "tooling matrix succeeded."
          fi
