name: tooling

# Lightweight PR merge checks on every supported operating system.
# The required check is the aggregate `tooling-gate`; manually dispatched
# release workflow contexts gate release acceptance, not ordinary PR merges.
#
# No `paths` filter on purpose: the required check must always report a
# result instead of staying pending on changes outside the filter.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the operating systems GitHub can always schedule.
        # macOS also runs on pushes to main and manual dispatch; tooling-gate
        # treats a queue-cancelled macOS leg there as runner unavailability,
        # so an unavailable macOS runner never blocks a pull request.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-2025"]') || fromJSON('["ubuntu-latest","windows-2025","macos-15"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Prepare the tooling log directory
        run: mkdir -p "$RUNNER_TEMP/tooling-logs"

      - name: Incremental harness build
        run: |
          dotnet build eng/harness/FunnySharp.Harness.fsproj -p:RestoreLockedMode=true 2>&1 | tee "$RUNNER_TEMP/tooling-logs/build.log"

      - name: Verify the documentation snippets
        run: |
          dotnet fsi build.fsx -- -p verify-docs-snippets 2>&1 \
            | tee "$RUNNER_TEMP/tooling-logs/verify-docs-snippets.log"

      - name: Check the workflow action pins
        run: |
          dotnet fsi build.fsx -- -p check-action-pins 2>&1 \
            | tee "$RUNNER_TEMP/tooling-logs/action-pins.log"

      - name: Upload tooling logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tooling-logs-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tooling-logs
          if-no-files-found: ignore
          retention-days: 7

  # One required aggregate check instead of three required matrix contexts.
  # Runner-infrastructure cancellations are warnings, not code failures: a job
  # cancelled before any runner picked it up, or one GitHub never reports
  # complete after its last step succeeded. A leg that ran and failed still
  # fails this gate.
  tooling-gate:
    name: tooling-gate
    needs: tooling
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the tooling matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="${{ needs.tooling.result }}"
          if [ "$result" = "success" ]; then
            echo "tooling matrix succeeded."
            exit 0
          fi

          # GitHub can leave a finished job without reporting completion (the
          # runner dies after its last step) or cancel a job before a runner
          # picks it up. Both are infrastructure, not code failures. The API
          # row carries every step conclusion so the gate can tell them apart.
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("tooling (")) | [.name, .conclusion, (.runner_name // ""), (.steps | length), ([.steps[].conclusion] | join(","))] | join("|")')
          if [ -z "$jobs" ]; then
            echo "::error::could not read any tooling matrix job results."
            exit 1
          fi

          fail=0
          infra=0
          required=0
          while IFS='|' read -r name conclusion runner steps step_results; do
            case "$name" in
              "tooling (ubuntu-latest)"|"tooling (windows-2025)")
                required=$((required + 1))
                required_leg=1
                ;;
              "tooling (macos-15)")
                required_leg=0
                ;;
              *)
                echo "::error::unexpected tooling matrix job '$name'."
                fail=1
                continue
                ;;
            esac

            if [ "$conclusion" = "success" ]; then
              continue
            fi

            # A cancelled job is infrastructure when it never started a step,
            # or when every step it did run finished successfully. A required
            # leg still needs at least one successfully completed step.
            all_steps_ok=1
            if [ -n "$step_results" ] && printf '%s' "$step_results" | tr ',' '\n' | grep -qvx 'success'; then
              all_steps_ok=0
            fi
            if [ "$conclusion" = "cancelled" ] \
              && { [ "$steps" = "0" ] || [ "$all_steps_ok" -eq 1 ]; } \
              && { [ "$required_leg" -eq 0 ] || [ "$steps" -gt 0 ]; }; then
              infra=$((infra + 1))
              echo "::warning::$name was cancelled by the runner ($steps step(s): ${step_results:-none}); treating it as infrastructure, not a code failure."
              continue
            fi

            echo "::error::$name concluded '$conclusion' ($steps step(s): ${step_results:-none})."
            fail=1
          done <<< "$jobs"

          if [ "$required" -lt 2 ]; then
            echo "::error::the required operating systems did not both report a result."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          if [ "$infra" -ne 0 ]; then
            echo "tooling matrix passed with $infra infrastructure-cancelled leg(s)."
          else
            echo "tooling matrix succeeded."
          fi
