name: release

# Heavy package/platform tests run only on explicit human dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  COMPATIBILITY_FEED: https://api.nuget.org/v3/index.json
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  win-x64:
    name: release / win-x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Record runtime provenance
        shell: bash
        run: |
          dotnet --info
          printf 'CANDIDATE_SHA=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\nIMAGE_OS=%s\nIMAGE_VERSION=%s\n' "$CANDIDATE_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"


      # Benchmarks are a developer-machine activity (docs/release-readiness.md):
      # the release pipeline keeps only integration checks in CI (build, full
      # test suites, examples, pack, format, compatibility consumers);
      # Git identifies the source; results come from the commands themselves.
      - name: Run canonical release
        shell: bash
        run: >
          dotnet fsi build.fsx -- -p release
          -AttemptId "${{ github.run_id }}-${{ github.run_attempt }}-win-x64"
          -CompatibilityRuntimeIdentifier win-x64
          -CompatibilityPackageFeed "$COMPATIBILITY_FEED"
          -SkipBenchmarks

      - name: Upload canonical candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-win-x64
            !artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-win-x64/nuget-packages/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-win-x64
            !artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-win-x64/nuget-packages/**
          if-no-files-found: error
          retention-days: 7

  linux-x64:
    name: release / linux-x64
    needs: win-x64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Record runtime provenance
        shell: bash
        run: |
          dotnet --info
          printf 'CANDIDATE_SHA=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\nIMAGE_OS=%s\nIMAGE_VERSION=%s\n' "$CANDIDATE_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"


      - name: Download canonical candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canonical-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/canonical-win

      - name: Run source and platform proof
        shell: bash
        run: >
          dotnet fsi build.fsx -- -p release
          -AttemptId "${{ github.run_id }}-${{ github.run_attempt }}-linux-x64"
          -CompatibilityRuntimeIdentifier linux-x64
          -CompatibilityPackageFeed "$COMPATIBILITY_FEED"
          -SkipBenchmarks

      - name: Consume canonical packages
        shell: bash
        run: >
          dotnet fsi build.fsx -- -p compatibility
          -PackageDirectory artifacts/canonical-win/packages
          -OutputDirectory artifacts/canonical-consumer/linux-x64
          -RuntimeIdentifier linux-x64
          -PackageFeed "$COMPATIBILITY_FEED"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-linux-x64
            !artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-linux-x64/nuget-packages/**
            artifacts/canonical-consumer/linux-x64
          if-no-files-found: error
          retention-days: 7

  osx-arm64:
    name: release / osx-arm64
    needs: win-x64
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Record runtime provenance
        shell: bash
        run: |
          dotnet --info
          printf 'CANDIDATE_SHA=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\nIMAGE_OS=%s\nIMAGE_VERSION=%s\n' "$CANDIDATE_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"


      - name: Download canonical candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canonical-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/canonical-win

      - name: Run source and platform proof
        shell: bash
        run: >
          dotnet fsi build.fsx -- -p release
          -AttemptId "${{ github.run_id }}-${{ github.run_attempt }}-osx-arm64"
          -CompatibilityRuntimeIdentifier osx-arm64
          -CompatibilityPackageFeed "$COMPATIBILITY_FEED"
          -SkipBenchmarks

      - name: Consume canonical packages
        shell: bash
        run: >
          dotnet fsi build.fsx -- -p compatibility
          -PackageDirectory artifacts/canonical-win/packages
          -OutputDirectory artifacts/canonical-consumer/osx-arm64
          -RuntimeIdentifier osx-arm64
          -PackageFeed "$COMPATIBILITY_FEED"

      - name: Upload macOS arm64 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-osx-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-osx-arm64
            !artifacts/release-candidate/${{ env.CANDIDATE_SHA }}/${{ github.run_id }}-${{ github.run_attempt }}-osx-arm64/nuget-packages/**
            artifacts/canonical-consumer/osx-arm64
          if-no-files-found: error
          retention-days: 7

  osx-x64-consumer:
    name: release / osx-x64-consumer
    needs: win-x64
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Record runtime provenance
        shell: bash
        run: |
          dotnet --info
          printf 'CANDIDATE_SHA=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\nIMAGE_OS=%s\nIMAGE_VERSION=%s\n' "$CANDIDATE_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"


      - name: Download canonical candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canonical-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/canonical-win

      - name: Run bounded canonical-package smoke
        shell: bash
        run: >
          dotnet fsi build.fsx -- -p compatibility
          -PackageDirectory artifacts/canonical-win/packages
          -OutputDirectory artifacts/canonical-consumer/osx-x64
          -RuntimeIdentifier osx-x64
          -PackageFeed "$COMPATIBILITY_FEED"
          -Scenario CoreSmoke,AspNetCoreSmoke

      - name: Upload macOS x64 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-osx-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/canonical-consumer/osx-x64
          if-no-files-found: error
          retention-days: 7
